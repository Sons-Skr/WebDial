name: Build APK

on:
  workflow_dispatch:
  # Optional: Trigger automatically on version tags (e.g., v1.0.0)
  # push:
  #   tags:
  #   - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- YOUR EXISTING BUILD STEPS HERE ---
      # Example: Setup Java, Gradle, build app-release.apk, etc.
      
      - name: Build APK
        run: |
          # Your build command here (e.g., ./gradlew assembleRelease)
          echo "Building..."

      # 1. (Optional) Keep artifact upload if you want it in the Actions tab too
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDial-APK
          path: app/build/outputs/apk/release/app-release.apk # Update to your actual path

      # 2. Automatically upload APK to GitHub Releases
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Optional: Only run this if triggered by a tag
        with:
          files: app/build/outputs/apk/release/app-release.apk # Update to your actual APK path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
